# Common for all challenges sections
category: ""
value: 40
type: mayfly
extra:
  image: file-explorer:latest
  port: 3001
  ttl_seconds: 1800
  vcpus: 1

# Required sections
name: "File Explorer"
description: |
  Expose hidden files in the web application.

# mayfly challenges have no static flags -- MayflyChallenge.attempt() never queries the
# Flags table, each team gets a fresh flag_hash minted per instance at launch time.

# Tags are used to classify your challenge with topics. You should provide at
# least one.
# Can be removed if unused
# Accepts strings
tags:
  - node.js
  - Snyk Open Source

# Provide paths to files from the same directory that this file is in
# Accepts strings
#files:


# Hints are used to give players a way to buy or have suggestions. They are not
# required but can be nice.
# Can be removed if unused
# Accepts dictionaries or strings
hints:
  - {
    content: "Fork this repo and import into Snyk https://github.com/apj-ctf/file-explorer",
    cost: 0
  }
  - {
    content: "It uses a vulnerability called Directory Traversal (see 'st' library).
            <br>
            <br>
            A Directory Traversal attack is an attack aimed at accessing files and directories outside the intended folder.
            By manipulating files with dot-dot-slash (`../`) arrays and their variations, or by using absolute file paths,
            including application source code, settings, and other important system files,
            May be able to access arbitrary files and directories stored on the file system.",
      cost: 10
  }

# The state of the challenge.
# This is visible by default. It takes two values: hidden, visible.
state: hidden

# Specifies what version of the challenge specification was used.
# Subject to change until ctfcli v1.0.0
version: "0.1"
